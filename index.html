<style>

:root[data-theme=dark]{--ink:#e8f3ef;--bg:#0b1714;--card:#13251f;--ln:#244039;--b:#2dd4bf;--bt:#04201c;--m:#9bb5ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,.big,.q{font-family:Sora,'DM Sans',sans-serif;margin:0;line-height:1.25}h1{font-size:1.6rem}h2{font-size:1.15rem;margin:24px 0 10px}
#sb{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:10px max(16px,calc(50% - 440px));background:var(--bg);border-bottom:1px solid var(--ln);overflow-x:auto}

main{max-width:880px;margin:0 auto;padding:22px 16px 56px}

.btn{all:unset;cursor:pointer;background:var(--b);color:var(--bt);font-weight:700;padding:11px 20px;border-radius:99px;display:inline-block;text-align:center}.btn:focus-visible,.opt:focus-visible,#sb button:focus-visible{outline:3px solid var(--y)}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}.btn.y{background:var(--y);color:#2b1c00}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}

.opt:hover{border-color:var(--b)}.opt.ok{border-color:var(--g);background:rgba(22,163,74,.15)}.opt.no{border-color:var(--r);background:rgba(229,72,77,.14)}
.q{font-size:1.15rem;font-weight:600;line-height:1.5;margin:10px 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.fb{border-radius:14px;padding:12px 16px;margin:8px 0}.fb.ok{background:rgba(22,163,74,.15)}.fb.no{background:rgba(229,72,77,.14)}
.inp{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:500 1.05rem 'DM Sans',sans-serif;margin:12px 0}
details{margin:8px 0}summary{cursor:pointer;color:var(--b);font-weight:600}table{border-collapse:collapse;margin:6px auto}td{padding:6px 18px;border:1px solid var(--ln)}
.gfx{text-align:center;margin:6px auto;max-width:360px;color:var(--ink)}.gfx svg{max-width:100%;height:auto}

:root[data-theme=light]{--bg:#fff8e7;--ink:#2d2a4a;--card:#fff;--ln:#f0dfb8;--b:#ff7a45;--bt:#fff;--m:#6b6785;--g:#2bb673;--y:#ffc233;--r:#ef5b5b}
body{font-family:Nunito,system-ui,sans-serif;font-size:18px;font-weight:600;background:var(--bg) radial-gradient(circle at 20px 20px,#ffe9a8 3px,transparent 4px) 0 0/44px 44px}

.btn.s{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ln)}.btn.y{background:var(--y);box-shadow:0 5px 0 #c98f00}

/* tema ceria kelas 7 */
.card h1{background:linear-gradient(90deg,#ff7a45,#9b5de5,#3b9cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bab{position:relative;transition:transform .15s}.bab:hover{transform:translateY(-4px) rotate(-.4deg)}
.bab.b1,.bab.b8,.bab.b15{background:#fff1e6}.bab.b2,.bab.b9,.bab.b16{background:#e8f5ff}.bab.b3,.bab.b10,.bab.b17{background:#eafaf0}.bab.b4,.bab.b11,.bab.b18{background:#f3ecff}.bab.b5,.bab.b12,.bab.b19{background:#fff8d6}.bab.b6,.bab.b13,.bab.b20{background:#ffeaf2}.bab.b7,.bab.b14{background:#e6fbf7}
.bab .big{font-size:1.4rem}
h2.sem{font-family:Fredoka,Nunito,sans-serif;background:linear-gradient(90deg,#ff7a45,#ffc233);color:#fff;padding:10px 20px;border-radius:20px;display:inline-block;margin:28px 0 12px;box-shadow:0 4px 0 #c98f00}
.mark{margin:12px 0;padding:10px 16px;border-radius:18px;border:3px dashed #f0c14b;background:#fffbe6;text-align:center;font-weight:800;color:#a06a00}
.hero{background:linear-gradient(135deg,#ff7a45,#ffb347 50%,#ffd93d)}
#sb{border-bottom:5px solid;border-image:linear-gradient(90deg,#ff7a45,#ffc233,#2bb673,#3b9cff,#9b5de5) 1}
@keyframes pop{0%{transform:scale(.94);opacity:.6}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card{animation:pop .35s ease both}.opt.ok{animation:pop .4s}.opt.no{animation:shk .35s}.opt:hover{transform:translateY(-2px)}
.lbl{display:block;text-align:left;font-weight:800;font-size:.9rem;color:var(--m);margin:6px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}.chip{display:inline-flex;align-items:center;background:#fff3c4;border:2px solid #f0c14b;border-radius:99px;overflow:hidden}.chip button{border:0;background:none;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer}.chip b{padding:8px 10px;cursor:pointer;color:#a06a00}.chip b:hover{background:#ffd93d}#syn{padding:4px 12px;font-size:.8rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== tema royal: midnight + emas ===== */
:root[data-theme=light]{--bg:#faf5ea;--ink:#1c1840;--card:#fffdf8;--ln:#eadfc2;--b:#4a2fbd;--bt:#fff;--m:#6a6585;--g:#1fae6b;--y:#e8b53a;--r:#e5484d;--gold:linear-gradient(135deg,#f6d77a,#d4a017 55%,#b8860b)}
body{background:var(--bg);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
body::before{top:-20vmax;left:-15vmax;background:radial-gradient(circle,#c9b6ff,transparent 65%)}
body::after{bottom:-25vmax;right:-15vmax;background:radial-gradient(circle,#ffd98a,transparent 65%);animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1,h2,#sb .lg{font-family:'Playfair Display',Georgia,serif;font-weight:800}
h2.sem{font-family:Fredoka,Nunito,sans-serif;background:linear-gradient(90deg,#2d1b69,#6a3df0);color:#f6d77a;box-shadow:0 4px 0 #1a1245}

#sb{position:sticky;background:linear-gradient(90deg,#1a1245,#2d1b69 60%,#1a1245);border:0;border-image:none;box-shadow:0 8px 26px rgba(26,18,69,.4)}
#sb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
#sb .lg{color:#fff}#sb .lg i{background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#sb button{color:#cfc8ee;transition:.2s}#sb button:hover{color:#fff;background:rgba(255,255,255,.12)}
#sb button.on{background:var(--gold);color:#2a1d00;box-shadow:0 0 18px rgba(232,181,58,.55)}#sb .mu{color:#cfc8ee}
.card{background:linear-gradient(180deg,#fffefb,#fff9ec);border:1px solid #ecdcae;border-radius:24px;box-shadow:0 10px 30px -12px rgba(60,40,140,.25),inset 0 1px 0 #fff;transition:transform .25s,box-shadow .25s}
.card:hover{box-shadow:0 18px 40px -14px rgba(60,40,140,.35)}
.card h1{background:linear-gradient(90deg,#2d1b69,#7a4dff,#c9962b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grid .card:hover,.bab:hover{transform:translateY(-6px)}
.bab{border-left:6px solid #d4a017}
.hero{background:linear-gradient(135deg,#1a1245,#3a1f9a 55%,#6a3df0);color:#fff;border:1px solid rgba(246,215,122,.5);border-radius:30px;position:relative;overflow:hidden;box-shadow:0 20px 50px -18px rgba(58,31,154,.7)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(246,215,122,.22) 48%,transparent 66%);transform:translateX(-100%);animation:sheen 5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.hero::after{animation:flo 4s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-8px) rotate(6deg)}}
.lv{background:var(--gold);color:#2a1d00;box-shadow:0 0 22px rgba(246,215,122,.6)}
.btn{background:linear-gradient(135deg,#3b27a8,#6a3df0);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 #231570,0 12px 24px -8px rgba(74,47,189,.6);transition:transform .15s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.btn:hover::after{left:130%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #231570}
.btn.s{background:#fff;color:var(--ink);border:1.5px solid #e2d3a4;box-shadow:0 4px 0 #eadfc2}
.btn.y{background:var(--gold);color:#2a1d00;box-shadow:0 6px 0 #8a6508,0 12px 24px -8px rgba(212,160,23,.6)}
.btn.dng{background:linear-gradient(135deg,#e5484d,#b4232a);color:#fff;box-shadow:0 6px 0 #7d1319}
.btn.lvb.l1{background:linear-gradient(135deg,#1fae6b,#52d69a);box-shadow:0 6px 0 #14804d}
.btn.lvb.l2{background:linear-gradient(135deg,#2f80ed,#56b4ff);box-shadow:0 6px 0 #1f5fb5}
.btn.lvb.l3{background:linear-gradient(135deg,#7b3fe4,#b583ff);box-shadow:0 6px 0 #54299f}
.bar{background:#efe6cc;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.bar i{background:linear-gradient(90deg,#d4a017,#f6d77a,#d4a017);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s}
@keyframes shim{to{background-position:-200% 0}}
.mark{border-color:#d4a017;background:#fff8e1;color:#7a5600}
.opt{border:2px solid #e8dab0;border-radius:18px;box-shadow:none;transition:.2s}
.opt:hover{border-color:#6a3df0;box-shadow:0 8px 20px -8px rgba(106,61,240,.4);transform:translateY(-3px)}
.opt.ok{border-color:var(--g)}.opt.no{border-color:var(--r)}
.inp{border:1.5px solid #e2d3a4;background:#fffdf8}.inp:focus{outline:none;border-color:#6a3df0;box-shadow:0 0 0 4px rgba(106,61,240,.18)}
table tr:first-child td{background:#f6eed6}
.kel{border:2px dashed #e5484d;background:#fff5f5}.kel .row{gap:12px}
/* leaderboard */
.lbw{max-width:600px;margin:26px auto;padding:22px 16px 18px;border-radius:30px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#3a1f9a 0%,#1a1245 60%,#0d0828 100%);border:1px solid rgba(246,215,122,.55);box-shadow:0 30px 60px -20px rgba(26,18,69,.8),inset 0 0 60px rgba(246,215,122,.08);animation:pop .5s both}
.lbw::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;animation:tw 3s ease-in-out infinite alternate;background:radial-gradient(circle at 20% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 25%,#fff 0 1px,transparent 2px),radial-gradient(circle at 60% 10%,#f6d77a 0 1.5px,transparent 2.5px),radial-gradient(circle at 35% 40%,#fff 0 1px,transparent 2px),radial-gradient(circle at 90% 60%,#f6d77a 0 1px,transparent 2px)}
@keyframes tw{to{opacity:.25}}
.lbh{text-align:center;position:relative;margin-bottom:18px}.lbh span{font-size:2rem;display:block;animation:flo 3s ease-in-out infinite}
.lbh h2{margin:0;font-size:1.9rem;letter-spacing:3px;text-transform:uppercase;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lbh small{color:#cfc8ee;letter-spacing:2px;font-size:.75rem;text-transform:uppercase}
#lb{position:relative}#lb .mu{color:#cfc8ee}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:16px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;animation:up .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d)}.pd.ph{visibility:hidden}
@keyframes up{from{opacity:0;transform:translateY(60px)}}
.pcr{font-size:1.8rem;height:2.2rem;animation:flo 2.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #f6d77a)}
.pav{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.6rem 'Playfair Display',serif;color:#1a1245;margin:2px 0 6px;border:3px solid #fff}
.pav i{position:absolute;right:-10px;bottom:-8px;font-size:1.5rem;font-style:normal}
.p1 .pav{width:84px;height:84px;font-size:2.1rem;background:var(--gold);box-shadow:0 0 0 4px rgba(246,215,122,.35),0 0 40px rgba(246,215,122,.8);animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(246,215,122,.2),0 0 60px rgba(246,215,122,1)}}
.p2 .pav{background:linear-gradient(135deg,#f4f6fa,#a9b3c4);box-shadow:0 0 24px rgba(200,210,230,.6)}
.p3 .pav{background:linear-gradient(135deg,#f0c39a,#b86f35);box-shadow:0 0 24px rgba(205,127,50,.6)}
.pnm{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}.p1 .pnm{font-size:1.1rem;color:#f6d77a}
.pcl{font-size:.68rem;color:#cfc8ee;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pxp{font:800 1.15rem Fredoka,sans-serif;margin:4px 0 6px}.pxp small{font-size:.65rem;margin-left:3px;opacity:.8}
.pbk{width:100%;display:grid;place-items:center;border-radius:14px 14px 0 0;font:800 2.2rem 'Playfair Display',serif;color:rgba(26,18,69,.85)}
.p1 .pbk{height:120px;background:linear-gradient(180deg,#f6d77a,#b8860b)}.p2 .pbk{height:88px;background:linear-gradient(180deg,#eef1f6,#9aa5b8)}.p3 .pbk{height:64px;background:linear-gradient(180deg,#f0b27a,#a8642b)}
.lr{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:8px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);animation:up .5s both;animation-delay:calc(.7s + var(--d));transition:.2s}
.lr:hover{background:rgba(246,215,122,.14);transform:translateX(4px)}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(246,215,122,.18);color:#f6d77a;font-size:.9rem}
.rn{flex:1;min-width:0;display:flex;flex-direction:column}.rn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn small{color:#cfc8ee;font-size:.72rem}.rx{color:#f6d77a;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

/* ===== 4 tema baru: ocean, synthwave, sakura, matrix ===== */
:root{--gold:linear-gradient(135deg,#f6d77a,#d4a017 55%,#b8860b)}
:root[data-theme=ocean]{--ink:#08303f;--bg:#e8f7fb;--card:#fff;--ln:#bfe6ef;--soft:#dff3f8;--b:#0891b2;--m:#4d7a89;--y:#f5b82e;--g:#12b886;--r:#ef5b5b;--bgr:linear-gradient(135deg,#0ea5e9,#14b8a6);--bsh:#0b6f8c;--bt:#fff;--sbg:linear-gradient(90deg,#063a5c,#0a5f8a 60%,#063a5c);--sbt:#bfe9f7;--sblg:#fff;--sbo:linear-gradient(135deg,#7dd3fc,#5eead4);--sbx:#053247;--hd:linear-gradient(135deg,#0369a1,#0891b2 55%,#14b8a6);--o1:#67e8f9;--o2:#5eead4;--lbg:radial-gradient(120% 80% at 50% 0%,#0e7490 0%,#063a5c 62%,#021b2e 100%);--fh:Fredoka,Nunito,sans-serif;--oo:.45;color-scheme:light}

[()=>{const k=ri(1,10);return Q(`Kecepatan ${k*18} km/jam sama dengan ... m/s`,k*5,'Bagi dengan 3,6 untuk mengubah km/jam menjadi m/s.',[k*18*3.6,k*10,k*18])},
()=>{const [a,b]=pick([[3,4],[6,8],[9,12]]);return Q(`Andi berjalan ${a} m ke timur lalu ${b} m ke utara. Perpindahannya ... m`,Math.hypot(a,b),'Perpindahan: garis lurus awal ke akhir (segitiga siku-siku).',[a+b,Math.abs(b-a),a*b])}],
[()=>{const v0=ri(0,10),a=ri(2,5),t=ri(2,8);return Q(`Benda berkecepatan awal ${v0} m/s dipercepat ${a} m/s². Kecepatan setelah ${t} s ... m/s`,v0+a*t,'vt = v0 + a × t.',[a*t,v0+a+t,v0*a*t])},
()=>{const t=ri(1,4),v1=ri(20,60),v2=ri(20,60);return Q(`Dua motor berjarak ${(v1+v2)*t} km berangkat bersamaan berlawanan arah dengan kecepatan ${v1} dan ${v2} km/jam. Bertemu setelah ... jam`,t,'Kecepatan relatif = v1 + v2; t = jarak ÷ kecepatan relatif.',[t+1,t*2,Math.abs(v1-v2)])}]),
SB('Gaya dan Hukum Newton','Hukum I Newton: benda diam atau bergerak lurus beraturan tetap begitu jika resultan gaya nol. Hukum II: F = m × a. Hukum III: gaya aksi sama besar dan berlawanan arah dengan gaya reaksi. Berat w = m × g, g ≈ 10 m/s². Satuan gaya adalah newton (N).',
[()=>{const m=ri(2,10),a=ri(2,8);return Q(`Benda bermassa ${m} kg dipercepat ${a} m/s². Gaya yang bekerja ... N`,m*a,'F = m × a.',[m+a,m*a+m,m*a*2])},
bk([['Penumpang terdorong ke depan saat mobil direm mendadak. Peristiwa ini sesuai hukum...','I Newton (kelembaman)',['II Newton','III Newton','Archimedes'],'Tubuh mempertahankan geraknya: kelembaman.'],['Roket menyembur gas ke bawah dan terdorong ke atas. Ini hukum...','III Newton',['I Newton','II Newton','Pascal'],'Aksi-reaksi: hukum III.']])],
[()=>{const m=ri(2,5),a=ri(1,6),F2=ri(2,9),F1=m*a+F2;return Q(`Gaya ${F1} N ke kanan dan ${F2} N ke kiri bekerja pada benda ${m} kg. Percepatannya ... m/s²`,a,`Resultan = ${F1} − ${F2} = ${m*a} N, lalu a = F ÷ m.`,[(F1+F2)/m,F1/m,m*a])},
()=>{const m=ri(2,9)*5;return Q(`Berat benda bermassa ${m} kg (g = 10 m/s²) adalah ... N`,m*10,'w = m × g.',[m,m/10,m*9])}],
[()=>{const m=ri(2,6),a=ri(2,5);return Q(`Benda ${m} kg ditarik gaya ${m*a+10} N di lantai dengan gaya gesek 10 N. Percepatannya ... m/s²`,a,'Resultan = gaya tarik − gesek; a = F ÷ m.',[(m*a+20)/m,(m*a+10)/m,m*a])}])
],
5:[
SB('Ciri dan Klasifikasi Makhluk Hidup','Ciri makhluk hidup: bernapas, bergerak, butuh makan, tumbuh, berkembang biak, peka terhadap rangsang, beradaptasi, dan mengeluarkan zat sisa. Tingkatan takson: Kingdom, Filum, Kelas, Ordo, Famili, Genus, Spesies. Kunci dikotomi memakai pasangan ciri yang saling berlawanan untuk menentukan nama organisme.',
[bk([['Ciri yang dimiliki semua makhluk hidup adalah...','Berkembang biak',['Berpindah tempat','Berdaun hijau','Bersuara'],'Semua makhluk hidup berkembang biak.'],['Tingkatan takson terbesar adalah...','Kingdom',['Spesies','Genus','Famili'],'Kingdom mencakup paling banyak anggota.'],['Tingkatan takson terkecil adalah...','Spesies',['Genus','Ordo','Kingdom'],'Spesies adalah takson terkecil.'],['Nama ilmiah ditulis dengan sistem...','Binomial nomenklatur',['Trinomial','Monomial','Polinomial'],'Nama ilmiah terdiri dari genus dan spesies.']])],
[bk([['Hewan bertulang belakang, berambut, dan menyusui anaknya termasuk...','Mamalia',['Reptil','Amfibi','Aves'],'Ciri khas mamalia.'],['Tumbuhan berbiji tertutup disebut...','Angiospermae',['Gymnospermae','Pteridophyta','Bryophyta'],'Biji dilindungi buah.'],['Kunci dikotomi menggunakan...','Pasangan ciri yang berlawanan',['Ciri acak','Ukuran tubuh saja','Warna saja'],'Tiap langkah punya dua pilihan.']])],
[bk([['Paus hidup di laut tetapi digolongkan mamalia karena...','Bernapas dengan paru-paru dan menyusui',['Hidup di air','Bersirip','Berbentuk seperti ikan'],'Ciri menentukan klasifikasi, bukan habitat.'],['Kunci dikotomi: 1a berkaki → 2, 1b tidak berkaki → ular. Organisme berkaki empat dan bersisik ditentukan melalui...','Langkah 2 setelah memilih 1a',['Langkah 1b','Langsung ular','Tidak dapat ditentukan'],'Ikuti jalur sesuai ciri yang cocok.']])]
)
],
6:[
SB('Ekologi dan Keanekaragaman Hayati','Ekosistem terdiri dari komponen biotik dan abiotik. Produsen membuat makanan, konsumen memakan organisme lain, pengurai menguraikan sisa. Rantai makanan menunjukkan aliran energi satu arah; jaring-jaring makanan adalah gabungan rantai makanan. Hanya sekitar 10% energi diteruskan ke tingkat berikutnya. Pelestarian: cagar alam, daur ulang, reboisasi.',
[bk([['Contoh produsen dalam ekosistem adalah...','Rumput',['Belalang','Elang','Jamur'],'Produsen melakukan fotosintesis.'],['Pemakan tumbuhan disebut...','Herbivora',['Karnivora','Omnivora','Dekomposer'],'Herbivora makan tumbuhan.'],['Organisme pengurai sisa makhluk hidup adalah...','Jamur',['Kelinci','Rumput','Elang'],'Pengurai: jamur dan bakteri.']])],
[()=>{const E=pick([1000,5000,10000,20000]),n=ri(2,3);return Q(`Produsen menyimpan ${E} kJ energi. Energi yang tersedia pada tingkat trofik ke-${n} (aturan 10%) ... kJ`,E/Math.pow(10,n-1),'Tiap naik satu tingkat, energi tinggal 10%.',[E/10,E/100,E/1000,E*10].filter(x=>x!=E/Math.pow(10,n-1)))},
bk([['Hubungan lebah dan bunga yang sama-sama untung disebut...','Mutualisme',['Parasitisme','Predasi','Kompetisi'],'Kedua pihak untung: mutualisme.'],['Benalu di pohon mangga adalah contoh...','Parasitisme',['Mutualisme','Komensalisme','Netral'],'Benalu merugikan inang.']])],
[bk([['Populasi elang di suatu hutan menurun drastis. Dampak yang paling mungkin...','Populasi tikus meningkat lalu padi rusak',['Populasi tikus turun','Tidak ada dampak','Jumlah produsen tetap selamanya'],'Pemangsa hilang, populasi mangsa naik.'],['Mengapa rantai makanan umumnya hanya 4–5 tingkat?','Energi yang diteruskan makin sedikit',['Pemangsa makin lemah','Matahari berhenti','Pengurai terlalu banyak'],'Energi hilang sebagai panas tiap tingkat.']])]
)
],
7:[
SB('Bumi, Bulan, dan Tata Surya','Bumi berotasi 1 kali per 24 jam (siang dan malam) dan berevolusi mengelilingi Matahari 365¼ hari (pergantian musim, rasi bintang). Bumi berotasi 15° per jam. Bulan mengorbit Bumi sekitar 29,5 hari. Gerhana Matahari terjadi saat Bulan berada di antara Matahari dan Bumi; gerhana Bulan saat Bumi di antara Matahari dan Bulan.',
[bk([['Planet terdekat dari Matahari adalah...','Merkurius',['Venus','Mars','Bumi'],'Merkurius paling dekat Matahari.'],['Rotasi Bumi menyebabkan...','Pergantian siang dan malam',['Pergantian musim','Gerhana','Pasang surut saja'],'Rotasi: siang-malam.'],['Revolusi Bumi menyebabkan...','Pergantian musim',['Siang dan malam','Pasang naik','Gerhana bulan saja'],'Revolusi: pergantian musim.']])],
[()=>{const k=ri(1,6),d=k*15;return Q(`Dua kota berbeda bujur ${d}°. Beda waktunya ... jam`,k,'Bumi berotasi 15° per jam; bagi 15.',[d,k*2,k+1])},
bk([['Gerhana Matahari terjadi pada saat fase bulan...','Bulan baru',['Purnama','Perbani awal','Perbani akhir'],'Bulan di antara Matahari dan Bumi.'],['Planet terbesar di tata surya adalah...','Jupiter',['Saturnus','Bumi','Neptunus'],'Jupiter planet terbesar.']])],
[bk([['Gerhana Bulan total dapat disaksikan dari seluruh wilayah malam di Bumi, sedangkan gerhana Matahari total hanya di jalur sempit karena...','Bayangan Bulan di Bumi kecil',['Bulan lebih besar dari Bumi','Matahari lebih kecil dari Bulan','Bumi tidak berotasi'],'Umbra Bulan sempit.'],['Bumi mengelilingi Matahari. Seandainya sumbu rotasi Bumi tidak miring, yang akan hilang adalah...','Pergantian musim',['Siang dan malam','Revolusi','Gerhana Bulan saja'],'Kemiringan sumbu menyebabkan musim.']])]
)
],
8:[
SB('Sel, Mikroskop, dan Tingkat Organisasi','Sel adalah unit struktural dan fungsional terkecil makhluk hidup. Sel tumbuhan punya dinding sel, kloroplas, dan vakuola besar; sel hewan tidak. Inti sel (nukleus) mengatur kegiatan sel, mitokondria menghasilkan energi, membran sel mengatur keluar-masuk zat. Organisme uniseluler terdiri dari satu sel (amoeba), multiseluler banyak sel. Mikroskop memperbesar benda kecil: perbesaran = lensa okuler × lensa objektif.',
[bk([['Unit terkecil penyusun makhluk hidup adalah...','Sel',['Jaringan','Organ','Sistem organ'],'Sel adalah unit struktural dan fungsional terkecil.'],['Organel penghasil energi pada sel adalah...','Mitokondria',['Kloroplas','Vakuola','Ribosom'],'Mitokondria: respirasi sel.'],['Bagian yang hanya ada pada sel tumbuhan adalah...','Dinding sel',['Inti sel','Membran sel','Sitoplasma'],'Sel hewan tidak punya dinding sel.']])],
[()=>{const o=pick([5,10,15]),b=pick([4,10,40]);return Q(`Lensa okuler ${o}× dan objektif ${b}×. Perbesaran total mikroskop ... ×`,o*b,'Perbesaran = okuler × objektif.',[o+b,o*b*2,o*b/2])},
bk([['Contoh organisme uniseluler adalah...','Amoeba',['Kucing','Jamur tiram','Pohon mangga'],'Amoeba terdiri dari satu sel.'],['Urutan tingkat organisasi kehidupan yang benar...','Sel, jaringan, organ, sistem organ, organisme',['Jaringan, sel, organ, organisme','Organ, jaringan, sel, sistem organ','Sel, organ, jaringan, organisme'],'Dari yang terkecil ke terbesar.']])],
[bk([['Sel daun berwarna hijau dan sel akar tidak. Penyebabnya...','Sel daun memiliki kloroplas',['Sel akar tidak punya inti','Sel daun tidak punya vakuola','Sel akar punya dinding sel'],'Kloroplas berisi klorofil hijau.'],['Sel darah merah tidak punya inti agar...','Lebih banyak ruang untuk mengangkut oksigen',['Tidak dapat membelah','Lebih berat','Bentuknya bulat'],'Struktur sesuai fungsi.']])])
],
9:[
SB('Sistem Pencernaan, Peredaran Darah, Pernapasan, dan Ekskresi','Pencernaan: mulut, kerongkongan, lambung, usus halus (penyerapan), usus besar (penyerapan air). Darah diedarkan jantung lewat pembuluh arteri dan vena. Pernapasan: udara masuk hidung, trakea, bronkus, alveolus (pertukaran gas). Ekskresi: ginjal (urine), kulit (keringat), paru-paru (CO₂), hati. Zat aditif: pengawet, pewarna, pemanis; zat adiktif: nikotin, alkohol, narkotika.',
[bk([['Penyerapan sari makanan terjadi di...','Usus halus',['Lambung','Usus besar','Kerongkongan'],'Vili usus halus menyerap sari makanan.'],['Pertukaran oksigen dan karbon dioksida terjadi di...','Alveolus',['Trakea','Bronkus','Laring'],'Alveolus berdinding tipis dan basah.'],['Organ penyaring darah dan pembentuk urine adalah...','Ginjal',['Hati','Paru-paru','Lambung'],'Ginjal menyaring darah.']])],
[bk([['Pembuluh yang membawa darah dari jantung adalah...','Arteri',['Vena','Kapiler','Aorta vena'],'Arteri: keluar dari jantung.'],['Zat yang menyebabkan kecanduan adalah zat...','Adiktif',['Aditif','Pengawet','Pewarna'],'Contoh: nikotin dan alkohol.'],['Enzim amilase dalam air liur mencerna...','Karbohidrat',['Protein','Lemak','Vitamin'],'Amilase mengubah amilum menjadi gula.']])],
[bk([['Saat berolahraga, detak jantung dan napas meningkat karena...','Otot butuh lebih banyak oksigen',['Sel tidak butuh energi','Paru-paru mengecil','Darah berkurang'],'Respirasi sel meningkat.'],['Makanan berpengawet berlebihan berbahaya karena...','Zat aditif dapat merusak organ jika terakumulasi',['Pengawet menambah energi','Mengubah warna tubuh','Menghilangkan rasa lapar'],'Konsumsi berlebihan merugikan kesehatan.']])]
)
],
10:[
SB('Usaha, Energi, dan Pesawat Sederhana','Usaha W = F × s (J). Daya P = W ÷ t (watt). Energi potensial Ep = m × g × h; energi kinetik Ek = ½ m v². Energi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk (kekekalan energi). Tuas: F × lk = w × lb. Katrol tetap hanya mengubah arah gaya. Bidang miring mengurangi gaya yang dibutuhkan.',
[()=>{const F=ri(5,50),s=ri(2,10);return Q(`Gaya ${F} N memindahkan benda ${s} m searah gaya. Usaha ... J`,F*s,'W = F × s.',[F+s,F*s*2,F/s])},
()=>{const m=ri(1,9),h=ri(2,10);return Q(`Benda ${m} kg berada pada ketinggian ${h} m (g = 10 m/s²). Energi potensialnya ... J`,m*10*h,'Ep = m × g × h.',[m*h,m*10+h,m*5*h])}],
[()=>{const W=ri(1,10)*20,t=pick([2,4,5,10]);return Q(`Usaha ${W} J dilakukan dalam ${t} s. Dayanya ... watt`,W/t,'P = W ÷ t.',[W*t,W+t,W/t*2])},
()=>{const k=ri(2,5),f=ri(2,10),lb=ri(1,4);return Q(`Beban ${k*f} N diangkat dengan tuas. Lengan beban ${lb} m, lengan kuasa ${lb*k} m. Gaya kuasa ... N`,f,'F × lk = w × lb.',[k*f,f*k*k,f+k])}],
[()=>{const m=2*ri(1,5),v=ri(2,10);return Q(`Benda ${m} kg bergerak ${v} m/s. Energi kinetiknya ... J`,m/2*v*v,'Ek = ½ m v².',[m*v*v,m*v,m/2*v])},
()=>{const v=pick([10,20,30]),h=v*v/20;return Q(`Benda dijatuhkan dari ketinggian ${h} m (g = 10 m/s², gesekan diabaikan). Kecepatan saat tiba di tanah ... m/s`,v,'Ep berubah menjadi Ek: v = √(2gh).',[v*2,v/2,h])}])
],
11:[
SB('Getaran, Gelombang, Bunyi, dan Cahaya','Frekuensi f = n ÷ t (Hz), periode T = 1 ÷ f. Cepat rambat gelombang v = λ × f. Gelombang transversal: arah getar tegak lurus perambatan (cahaya, gelombang tali). Gelombang longitudinal: sejajar (bunyi). Bunyi butuh medium. Pemantulan bunyi (gema): d = v × t ÷ 2. Cermin cembung menyebar cahaya, cekung mengumpulkan; f = R ÷ 2. Lensa cembung mengumpulkan, lensa cekung menyebarkan. Mata miopi memakai lensa cekung, hipermetropi lensa cembung.',
[()=>{const t=ri(2,10),f=ri(2,10);return Q(`Bandul berayun ${f*t} kali dalam ${t} s. Frekuensinya ... Hz`,f,'f = n ÷ t.',[t,f*t,f+t])},
bk([['Gelombang yang arah getarnya sejajar arah rambat adalah...','Longitudinal',['Transversal','Elektromagnetik','Permukaan'],'Contoh: bunyi dan pegas.'],['Bunyi tidak dapat merambat di...','Ruang hampa',['Air','Udara','Besi'],'Bunyi butuh medium.']])],
[()=>{const l=ri(2,9),f=ri(2,10);return Q(`Gelombang panjang ${l} m berfrekuensi ${f} Hz. Cepat rambatnya ... m/s`,l*f,'v = λ × f.',[l+f,l*f*2,l/f])},
bk([['Cermin yang dipakai pada lampu senter dan lampu mobil adalah...','Cekung',['Cembung','Datar','Silinder'],'Cermin cekung memusatkan cahaya.'],['Penderita miopi (rabun jauh) ditolong dengan kacamata berlensa...','Cekung',['Cembung','Datar','Silinder'],'Lensa cekung menyebarkan sinar.']])],
[()=>{const t=pick([1,2,4]);return Q(`Gema terdengar ${t} s setelah teriakan (cepat rambat 340 m/s). Jarak dinding pantul ... m`,170*t,'d = v × t ÷ 2.',[340*t,85*t,170*t+t])},
()=>{const R=ri(1,10)*4;return Q(`Cermin cekung berjari-jari kelengkungan ${R} cm. Jarak fokusnya ... cm`,R/2,'f = R ÷ 2.',[R,R*2,R/4])}])
],
12:[
SB('Unsur, Senyawa, dan Campuran','Unsur adalah zat tunggal yang tidak dapat diuraikan lagi, ditulis dengan lambang (H, O, Na, Fe). Senyawa terbentuk dari dua unsur atau lebih dengan perbandingan tetap (H₂O, NaCl) dan sifatnya berbeda dari penyusunnya. Campuran dapat dipisahkan secara fisika: filtrasi, distilasi, sublimasi, kromatografi, dekantasi, penguapan.',
[bk([['Lambang unsur natrium adalah...','Na',['N','Ni','Nt'],'Natrium: Na.'],['Contoh senyawa adalah...','Air (H₂O)',['Oksigen (O₂)','Besi (Fe)','Emas (Au)'],'Senyawa terdiri dari dua unsur atau lebih.'],['Campuran pasir dan air dipisahkan dengan...','Filtrasi',['Distilasi','Sublimasi','Kromatografi'],'Pasir tak larut: disaring.']])],
[bk([['Campuran air dan alkohol dipisahkan dengan...','Distilasi',['Filtrasi','Dekantasi','Sublimasi'],'Titik didih berbeda: distilasi.'],['Perbedaan senyawa dan campuran adalah...','Senyawa punya perbandingan unsur tetap',['Campuran punya sifat baru','Senyawa mudah dipisah secara fisika','Campuran tidak terdiri dari zat'],'Campuran perbandingannya bebas.'],['Pewarna tinta dipisahkan dengan...','Kromatografi',['Filtrasi','Distilasi','Penguapan'],'Kromatografi memisahkan zat berwarna.']])],
[bk([['Air garam diuapkan hingga tersisa kristal. Garam dapat diperoleh kembali karena...','Pemisahan campuran adalah proses fisika',['Garam rusak saat dipanaskan','Air bereaksi dengan garam','Terbentuk zat baru'],'Campuran tidak mengubah sifat zat.'],['Serbuk besi dan belerang dipanaskan hingga terbentuk besi sulfida yang tidak dapat dipisah magnet. Ini berarti...','Terbentuk senyawa baru',['Masih campuran','Terjadi sublimasi','Besi tetap unsur bebas'],'Sifat berubah: senyawa.']])]
)
],
13:[
SB('Lapisan Bumi, Lempeng Tektonik, dan Mitigasi Bencana','Lapisan Bumi: kerak, mantel, inti luar (cair), inti dalam (padat). Lempeng tektonik bergerak: divergen (menjauh), konvergen (bertumbukan), transform (bergeser). Gempa terjadi akibat pelepasan energi di sesar atau tumbukan lempeng; skala Richter mengukur magnitudo. Gunung api terbentuk di zona subduksi. Mitigasi: jalur evakuasi, bangunan tahan gempa, sirene tsunami.',
[bk([['Lapisan Bumi yang paling tipis dan kita tempati adalah...','Kerak bumi',['Mantel','Inti luar','Inti dalam'],'Kerak adalah lapisan terluar.'],['Lapisan Bumi yang berwujud cair adalah...','Inti luar',['Kerak','Inti dalam','Mantel padat'],'Inti luar cair, inti dalam padat.'],['Alat pencatat getaran gempa adalah...','Seismograf',['Barometer','Higrometer','Termometer'],'Seismograf mencatat gempa.']])],
[bk([['Gunung berapi banyak di Indonesia karena...','Indonesia di pertemuan beberapa lempeng',['Tanahnya subur','Dekat laut','Iklim tropis'],'Zona subduksi menghasilkan magma.'],['Pergerakan dua lempeng saling bertumbukan disebut batas...','Konvergen',['Divergen','Transform','Statis'],'Konvergen: bertemu.'],['Tindakan yang tepat saat gempa di dalam gedung...','Berlindung di bawah meja kokoh',['Menggunakan lift','Berdiri di jendela','Berlari ke tangga ramai'],'Lindungi kepala dan jauhi kaca.']])],
[bk([['Gempa laut dangkal berkekuatan besar berpotensi tsunami karena...','Dasar laut bergeser mendadak menggerakkan air',['Angin kencang','Bulan purnama','Suhu laut naik'],'Pergeseran dasar laut memicu tsunami.'],['Setelah gempa besar dekat pantai, air laut surut tiba-tiba. Tindakan yang tepat...','Segera menuju tempat tinggi',['Mengambil ikan','Menonton dari pantai','Menunggu pengumuman'],'Surut adalah tanda tsunami.']])]
)
],
14:[
SB('Pertumbuhan dan Perkembangan','Pertumbuhan adalah pertambahan ukuran yang tidak dapat kembali; perkembangan adalah menuju kedewasaan fungsi. Pada tumbuhan, pertumbuhan primer terjadi di ujung akar dan batang; sekunder menambah diameter batang. Hormon tumbuhan: auksin, giberelin, sitokinin. Metamorfosis sempurna: telur, larva, pupa, dewasa (kupu-kupu); tidak sempurna: telur, nimfa, dewasa (belalang). Manusia: embrio, janin, bayi, anak, remaja, dewasa.',
[bk([['Pertambahan tinggi badan adalah contoh...','Pertumbuhan',['Perkembangan','Metamorfosis','Adaptasi'],'Pertumbuhan dapat diukur.'],['Metamorfosis sempurna dialami oleh...','Kupu-kupu',['Belalang','Kecoa','Capung'],'Memiliki tahap pupa.'],['Hormon yang memacu pemanjangan batang adalah...','Giberelin',['Etilen','Asam absisat','Kalsium'],'Giberelin memacu pemanjangan.']])],
[bk([['Urutan metamorfosis sempurna yang benar...','Telur, larva, pupa, dewasa',['Telur, nimfa, dewasa','Larva, telur, pupa, dewasa','Telur, pupa, larva, dewasa'],'Pupa ada di antara larva dan dewasa.'],['Biji kacang di tempat gelap tumbuh lebih panjang dan pucat karena...','Auksin bekerja tanpa cahaya',['Cahaya berlebih','Kekurangan air','Suhu terlalu tinggi'],'Cahaya menghambat auksin.']])],
[bk([['Faktor eksternal yang memengaruhi pertumbuhan tanaman adalah...','Cahaya dan air',['Gen dan hormon','Bentuk biji','Jenis kelamin'],'Faktor luar: cahaya, air, suhu, nutrisi.'],['Mengapa tinggi remaja tampak melonjak pada masa pubertas?','Hormon pertumbuhan dan hormon seks meningkat',['Tulang berhenti tumbuh','Otot menyusut','Jumlah sel berkurang'],'Pengaruh hormon.']])]
)

/* ===== PERLUASAN BANK SOAL: pasangan istilah-keterangan (4 gaya) + soal pernyataan ===== */
const mkT=raw=>{const R=raw.split(';').map(x=>x.trim().split('|')),
wr=(r,k)=>sh([...new Set(R.filter(x=>x!==r).map(x=>x[k]))].filter(x=>x!=r[k])).slice(0,3),
A=st=>()=>{const r=pick(R);return Q(st.replace('%',r[0]),r[1],`${r[0]}: ${r[1]}.`,wr(r,1))},
B=st=>()=>{const r=pick(R);return Q(st.replace('%',r[1]),r[0],`Keterangan "${r[1]}" sesuai dengan ${r[0]}.`,wr(r,0))},
nm=c=>c.length==1?'('+c[0]+')':c.length==2?`(${c[0]}) dan (${c[1]})`:`(${c[0]}), (${c[1]}), dan (${c[2]})`,
S3=()=>{let cs,t;do{cs=[];t=sh(R).slice(0,3).map((r,i)=>{const ok=Math.random()<.5;if(ok)cs.push(i+1);const d=ok?r[1]:pick(R.filter(x=>x!==r&&x[1]!=r[1]))[1];return`(${i+1}) ${r[0]}: ${d}`})}while(!cs.length);
const all=[[1],[2],[3],[1,2],[1,3],[2,3],[1,2,3]].map(nm),a=nm(cs);return Q(`Perhatikan pasangan istilah dan keterangan berikut! ${t.join('; ')}. Pasangan yang benar adalah...`,a,'Periksa tiap pasangan satu per satu dengan ringkasan materi.',sh(all.filter(x=>x!=a)).slice(0,3))},
S4=()=>{const f=ri(0,3),t=sh(R).slice(0,4).map((r,i)=>{const d=i==f?pick(R.filter(x=>x!==r&&x[1]!=r[1]))[1]:r[1];return`(${i+1}) ${r[0]}: ${d}`});return Q(`Perhatikan pasangan berikut! ${t.join('; ')}. Pasangan yang SALAH adalah...`,`(${f+1})`,'Hanya satu pasangan yang keterangannya tertukar.',[1,2,3,4].filter(x=>x!=f+1).map(x=>`(${x})`))};
return[[A('Keterangan yang sesuai untuk "%" adalah...'),A('Peran atau ciri utama "%" adalah...'),B('Istilah yang sesuai dengan keterangan "%" adalah...'),B('Yang paling tepat dengan ciri "%" adalah...')],[S3,B('Istilah yang cocok untuk "%" adalah...'),A('Pernyataan paling tepat tentang "%" adalah...')],[S4,S3]]},
AX=(g,i,raw)=>{const o=T[g][i],e=mkT(raw);e.forEach((a,k)=>o.L[k].push(...a))};

P.qs.forEach((q,i)=>{const a=P.sel[i],o=a!=null&&q.o[a]==q.a,ak=q.G+'_'+q.I+'_'+q.XL,pk=q.G+'.'+q.I;S.tot++;const c=S.ac[ak]||(S.ac[ak]=[0,0]);c[1]++;per[pk]=per[pk]||[0,0];per[pk][1]++;if(o){ok++;c[0]++;S.ok++;S.xp+=10;per[pk][0]++}else wrong(q,{g:q.G,i:q.I,L:q.XL})});
const sc=Math.round(ok/n*100);P.ok=ok;P.sc=sc;P.per=per;S.hist.push({g:0,i:-1,L:0,sc,n,t:Date.now()});if(S.hist.length>60)S.hist.shift();if(sc==100)S.perf=1;const d=day(new Date);if(!S.days.includes(d))S.days.push(d);sv();go('xres')}
W.ulg=()=>{const ck=(k,v,l)=>`<label class=ck><input type=checkbox ${X[k].includes(v)?'checked':''} onchange="xt('${k}',${v})"> ${l}</label>`,rd=(k,v,l)=>`<label class=ck><input type=radio name=${k} ${X[k]==v?'checked':''} onchange="X.${k}=${v}"> ${l}</label>`,h=S.hist.filter(x=>!x.g).slice(-5).reverse();
return`<h1>📝 Ulangan</h1>${curCard()}<p class=mu>Soal diacak dari bab dan level pilihanmu. Jawaban benar baru terlihat setelah ulangan selesai. Setiap ulangan baru berisi soal yang berbeda.</p><div class=card><h3>Pilih bab</h3>${GS.map(g=>ck('g',g,`Bab ${g}: ${CH[g-1]}`)).join('<br>')}<h3 style="margin-top:14px">Pilih level</h3>${[1,2,3].map(L=>ck('L',L,LN[L])).join('')}<h3 style="margin-top:14px">Jumlah soal</h3>${[10,20,25,40].map(n=>rd('n',n,n)).join('')}<h3 style="margin-top:14px">Waktu</h3>${rd('t',0,'Tanpa waktu')+[15,30,45,60].map(t=>rd('t',t,t+' menit')).join('')}<br><br><button class=btn onclick=startUlg()>🚀 Mulai ulangan</button><p class=mu id=xm></p></div><h2>Ulangan terakhir</h2>${h.map(x=>`<div class=card>${dt(x.t)} · <b>${x.sc}</b> (${x.n} soal)</div>`).join('')||'<p class=mu>Belum ada ulangan mandiri.</p>'}`};
W.xplay=()=>{const q=P.qs[P.k],a=P.sel[P.k],last=P.k==P.qs.length-1;
return`<div class="row sp"><b>📝 Ulangan</b>${P.tl?`<b id=tm>${Math.floor(P.left/60)}:${String(P.left%60).padStart(2,'0')}</b>`:''}</div><div class=mu>Soal ${P.k+1} dari ${P.qs.length} · jawaban benar ditampilkan di akhir</div>${bar(P.k/P.qs.length*100)}<div class=card>${q.g?`<div class=gfx>${q.g}</div>`:''}<div class=q>${P.k+1}. ${q.q}</div>${q.o.map((o,j)=>`<button class="opt ${a==j?'sel':''}" onclick="xsel(${j})">${o}</button>`).join('')}</div><div class=row>${a!=null?`<button class=btn onclick=xnext()>${last?'Selesai & lihat hasil':'Berikutnya'} →</button>`:`<button class="btn s" onclick=xnext()>${last?'Selesai':'Lewati'} →</button>`}</div>`};
W.xres=()=>{const n=P.qs.length;
return`<div class=card style="text-align:center"><div class=big style="font-size:3rem">${P.sc>=90?'🏆':P.sc>=70?'😄':'💪'}</div><h1>Ulangan selesai!</h1><div class=big style="font-size:3.2rem">${P.sc}</div><div style="font-size:2rem">${'⭐'.repeat(P.sc>=90?3:P.sc>=70?2:P.sc>=40?1:0)}</div>${bar(P.sc)}<p>Benar <b>${P.ok}</b> · Salah <b>${n-P.ok}</b> dari <b>${n}</b> soal.</p></div><h2>Penguasaan per materi</h2>${Object.entries(P.per).sort().map(([k,v])=>{const[g,i]=k.split('.'),a=Math.round(v[0]/v[1]*100);return`<div class=card><div class="row sp"><b>Bab ${g} · ${esc(T[g][i].n)}</b><span>${a}% (${v[0]}/${v[1]})</span></div>${bar(a)}</div>`}).join('')}<div class=row><button class=btn onclick="go('ulg')">📝 Ulangan baru</button><button class="btn s" onclick="go('home')">Beranda</button></div><h2>Review jawaban</h2>${P.qs.map((q,i)=>{const a=P.sel[i],o=a!=null&&q.o[a]==q.a;return`<div class=card><b>Soal ${i+1} ${o?'✅ Benar':'❌ Salah'}</b>${q.g?`<div class=gfx>${q.g}</div>`:''}<div>${q.q}</div>${o?'':`<div class=mu>Jawaban kamu: ${a==null?'(kosong)':q.o[a]}</div>`}<div>Jawaban benar: <b>${q.a}</b></div>${q.e?`<details><summary>💡 Pembahasan</summary><p>${q.e}</p></details>`:''}</div>`}).join('')}`};

const TH=[['lab','▣','Lab (flat)'],['kapur','▤','Papan Tulis'],['ocean','🌊','Samudra'],['synthwave','🌆','Synthwave'],['sakura','🌸','Sakura'],['matrix','🧮','Matrix Math']],
FXS={ocean:['🫧','🫧','🐠','🫧','🐚','🫧'],sakura:['🌸','🌸','🌺','🌸'],synthwave:['✦','+','✧','◆'],matrix:['∑','π','√','∞','±','÷','×','%','x²','0','1']};
function fx(t){const e=$('#fx');if(!e)return;const a=FXS[t];if(!a){e.innerHTML='';return}const up=t=='ocean'||t=='synthwave';e.className=up?'up':'dn';e.innerHTML=Array.from({length:t=='matrix'?26:18},(_,i)=>`<i style="left:${Math.random()*100}%;--s:${.8+Math.random()*1.4}rem;--t:${(up?12:9)+Math.random()*12}s;--dl:-${Math.random()*20}s;--dx:${Math.random()*80-40}px">${a[i%a.length]}</i>`).join('')}
function thUI(){const c=document.documentElement.dataset.theme;$('#thm').innerHTML=`<button class=thb onclick="$('#thm').classList.toggle('open')" aria-label="Ganti tema">🎨</button><div class=thp>${TH.map(t=>`<button class="${t[0]==c?'on':''}" onclick="setTh('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`}
function setTh(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('mk789theme',t)}catch(e){}thUI();fx(t)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),cl=['#ff3d8b','#ffd23f','#22d3ee','#8b5cf6','#34d399','#ff8a3d'],p=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,v:2+Math.random()*4,s:Math.random()*2-1,r:Math.random()*6,c:cl[Math.random()*6|0]}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.y+=o.v;o.x+=o.s*2;o.r+=.1;x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.fillRect(-o.w/2,-o.h/2,o.w,o.h);x.restore()});++f<240?requestAnimationFrame(d):c.remove()})()}

let GD={st:{},pr:{}},GF={skl:'',kls:'',q:'',d:null},GOK=false,GADM=false,gsub=false;
const isOn=p=>!!p&&p.isOnline===true&&(Date.now()+off-(p.last_changed||0))<90000;
function gSub(){if(!db||gsub)return;gsub=true;authP.then(()=>{db.ref(APP+'/ringkas').on('value',s=>{GD.st=s.val()||{};gUp()});db.ref(APP+'/presence').on('value',s=>{GD.pr=s.val()||{};gUp()})});setInterval(gUp,15000)}
function gUp(){if(V=='guru'&&GOK)gTab();if(V=='gdet'){const e=$('#gds');if(e)e.innerHTML=isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}}
function gOpt(id,vals,lbl,cur){const e=$(id);if(!e)return;e.innerHTML=`<option value="">${lbl}</option>`+vals.map(v=>`<option${v==cur?' selected':''}>${esc(v)}</option>`).join('')}
function gTab(){const ks=Object.keys(GD.st),sv2=x=>[...new Set(ks.map(k=>GD.st[k][x]).filter(Boolean))].sort();gOpt('#gsk',sv2('skl'),'Semua sekolah',GF.skl);gOpt('#gkl',sv2('kls'),'Semua kelas',GF.kls);const q=GF.q.toLowerCase(),rows=ks.map(k=>({k,d:GD.st[k],o:isOn(GD.pr[k]),lc:(GD.pr[k]||{}).last_changed||0})).filter(r=>(!GF.skl||r.d.skl==GF.skl)&&(!GF.kls||r.d.kls==GF.kls)&&(!q||(r.d.name||'').toLowerCase().includes(q))).sort((a,b)=>b.o-a.o||(a.d.name||'').localeCompare(b.d.name||''));
$('#gsm').innerHTML=`🟢 <b>${rows.filter(r=>r.o).length}</b> online · ${rows.length} siswa tampil dari ${ks.length}`;
$('#gt').innerHTML=rows.map(r=>{const d=r.d,a=d.tot?Math.round(d.ok/d.tot*100):0;return`<tr><td>${r.o?'🟢 Online':'⚪ Offline'}<td><b>${esc(d.name)}</b><td>${esc(d.kls)}<td>${esc(d.skl)}<td>${d.xp||0}<td>${d.tot||0}<td>${a}%<td>${r.o?'sekarang':dt(r.lc||d.upd)}<td><button class="btn s" onclick="gDet('${r.k}')">Detail</button>`}).join('')||'<tr><td colspan=9>Belum ada data siswa.'}
function gDet(k){GF.d=k;GD.dt=0;go('gdet');authP.then(()=>db.ref(APP+'/detail/'+k).get()).then(sn=>{GD.dt=sn.val();if(V=='gdet')render()}).catch(()=>{GD.dt=null;if(V=='gdet')render()})}
function gpin(){const em=(($('#ge')||{}).value||'').trim().toLowerCase();if($('#gp').value==GURU_PIN){GOK=true;GADM=em===ADMIN;render()}else $('#gm').textContent='PIN salah.'}
function gKel(){const e=$('#gkp');if(!GADM||!e)return;const on=isOn(GD.pr[GF.d]);e.innerHTML=`<div class="card kel"><h2 style="margin-top:0">⚙️ Kelola data siswa</h2><p class=mu>Hapus data siswa yang tidak dipakai. Progres, ringkasan, dan status online ikut terhapus. Tidak bisa dibatalkan. Jika siswa masih membuka aplikasi, datanya bisa muncul lagi.${on?' <b>Siswa ini sedang online.</b>':''}</p><div id=gkc class=row><button class="btn s" onclick="$('#gkp').innerHTML=''">Batal</button><button class="btn dng" onclick="gHapus()">🗑️ Hapus data siswa</button></div><p class=mu id=gkm></p></div>`}
function gHapus(c){if(!GADM||!db)return;const k=GF.d;if(!c){$('#gkc').innerHTML='<b>Yakin hapus permanen?</b><button class="btn s" onclick="gKel()">Tidak</button><button class="btn dng" onclick="gHapus(1)">Ya, hapus</button>';return}$('#gkm').textContent='Menghapus…';authP.then(()=>Promise.all(['detail','ringkas','presence'].map(x=>db.ref(APP+'/'+x+'/'+k).remove()))).then(()=>{delete GD.st[k];delete GD.pr[k];GF.d=null;go('guru')}).catch(()=>{$('#gkm').textContent='Gagal menghapus. Cek aturan database Firebase.'})}
W.guru=()=>{if(!GOK)return`<div class=card style="max-width:400px;margin:30px auto;text-align:center"><div class=big>👩‍🏫</div><h1>Dashboard Guru</h1><input id=ge type=email class=inp placeholder="Email guru" autocomplete=email onkeydown="event.key=='Enter'&&gpin()"><input id=gp type=password class=inp placeholder="PIN guru" onkeydown="event.key=='Enter'&&gpin()"><button class=btn onclick=gpin()>Masuk</button><p class=mu id=gm></p></div>`;if(!db)return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card>Firebase belum dikonfigurasi. Isi <code>FB_CONFIG</code> di bagian script agar monitoring realtime aktif.</div>`;gSub();setTimeout(gTab,0);return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card><div class=row style="flex-wrap:wrap;gap:8px"><select id=gsk class=inp onchange="GF.skl=this.value;gTab()"></select><select id=gkl class=inp onchange="GF.kls=this.value;gTab()"></select><input class=inp placeholder="🔍 Cari nama siswa" value="${esc(GF.q)}" oninput="GF.q=this.value;gTab()"></div><p class=mu id=gsm></p></div><div class="card tw"><table><tr><td><b>Status<td><b>Nama<td><b>Kelas<td><b>Sekolah<td><b>XP<td><b>Soal<td><b>Akurasi<td><b>Terakhir aktif<td><b>Aksi<tbody id=gt></tbody></table></div>`};
W.gdet=()=>{const raw=GD.dt;const back=`<button class="btn s" onclick="go('guru')">← Kembali ke daftar</button>`;if(raw===0)return back+'<div class=card>⏳ Memuat detail…</div>';if(!raw)return back+'<div class=card>Data siswa tidak ditemukan.</div>';const d=norm(raw),pc=(o,t)=>t?Math.round(o/t*100):null,col=x=>x==null?'':x<60?'color:#d62828;font-weight:800':'color:#1b8a4b;font-weight:800';
const babs=GS.map(g=>{let o=0,t=0;Object.entries(d.ac).forEach(([k,v])=>{if(k.split('_')[0]==g){o+=v[0];t+=v[1]}});return[g,o,t]}),weak=[];
const rows=GS.flatMap(g=>T[g].map((t,i)=>{const c=[1,2,3].map(L=>{const v=d.ac[g+'_'+i+'_'+L];if(!v)return'<td>–';const x=pc(v[0],v[1]);if(v[1]>=5)weak.push([x,`Bab ${g} · ${t.n} (L${L}) ${x}%`]);return`<td style="${col(x)}">${x}% <span class=mu>(${v[0]}/${v[1]})</span>`}).join('');return`<tr><td>B${g} · ${esc(t.n)}${c}`}));
return back+(GADM?`<button class="btn y" style="margin-left:8px" onclick="gKel()">⚙️ Kelola</button>`:'')+`<div id=gkp></div><h1>👤 ${esc(d.name)}</h1><p class=mu>Kelas ${esc(d.kls)} · ${esc(d.skl)} · <span id=gds>${isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}</span></p><div class=grid><div class=card><div class=big>⭐ ${d.xp}</div><div class=mu>XP</div></div><div class=card><div class=big>🔥 ${stk(d.days)}</div><div class=mu>hari beruntun</div></div><div class=card><div class=big>${d.tot}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${d.tot?Math.round(d.ok/d.tot*100):0}%</div><div class=mu>akurasi</div></div></div>
<h2>📊 Akurasi per bab</h2>${babs.map(b=>{const x=pc(b[1],b[2]);return`<div class=card><div class="row sp"><b>Bab ${b[0]}: ${CH[b[0]-1]}</b><span style="${col(x)}">${x==null?'belum ada':x+'% ('+b[1]+'/'+b[2]+')'}</span></div>${bar(x||0)}</div>`}).join('')}
<h2>🎯 Akurasi per sub-bab & level</h2><div class="card tw"><table><tr><td><b>Materi<td><b>L1<td><b>L2<td><b>L3${rows.join('')}</table></div>
<h2>⚠️ Perlu bimbingan</h2><div class=card>${weak.sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>x[1]).join('<br>')||'Belum cukup data (minimal 5 soal per level).'}</div>${hv(d)}`};

let LB=[],lbs=false;
function lbDraw(){const e=$('#lb');if(!e)return;if(!db){e.innerHTML='<p class=mu style="text-align:center">Aktifkan Firebase untuk melihat leaderboard.</p>';return}if(!LB.length){e.innerHTML='<p class=mu style="text-align:center">Belum ada peringkat. Jadilah yang pertama!</p>';return}

e.innerHTML=`<div class=podium>${pod(LB[1],1)}${pod(LB[0],0)}${pod(LB[2],2)}</div>`+LB.slice(3).map((x,j)=>`<div class=lr style="--d:${j*.07}s"><b class=rk>${j+4}</b><span class=rn><b>${esc(x.name)}</b><small>${esc(x.kls)} · ${esc(x.skl)}</small></span><b class=rx>${x.xp||0} XP</b></div>`).join('')}
function lbSub(){if(db&&!lbs){lbs=true;authP.then(()=>db.ref(APP+'/ringkas').orderByChild('xp').limitToLast(10).on('value',sn=>{const a=[];sn.forEach(c=>{a.push(c.val())});LB=a.reverse();lbDraw()},()=>{LB=[];lbDraw()}))}setTimeout(lbDraw,0);return''}
addEventListener('pagehide',()=>{if(db&&S){clearTimeout(stm);push()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&db&&S){clearTimeout(stm);push()}});
if(S)resume();
render();
{const y=$('#yr');if(y)y.textContent=new Date().getFullYear()}
{let t0='ocean';try{t0=localStorage.getItem('mk789theme')||'lab'}catch(e){}setTh(TH.some(x=>x[0]==t0)?t0:'ocean')}
